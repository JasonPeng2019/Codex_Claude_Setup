interface:
  display_name: "Project Topology"
  short_description: "Build significant modular project execution plans."
  default_prompt: "Use $project-topology only to build and validate a significant project execution workflow and plan, never for general coding or task execution. Emit the exact modular package with isolated global rules and independent STEP files composed from authoritative M01-M10 modules. Under every STEP entry-flow heading, copy the exact same canonical FAST_LANE_V2 usage block from the template before exactly three entry flows: NORMAL with only MI-NORMAL-* instances, FAST_LANE_V2_SERIES_1 with only distinct lightweight MI-FL2-S1-* instances for a scoped within-step repair that exits toward the later current progress bound, and FAST_LANE_V2_SERIES_2 with only distinct lightweight MI-FL2-S2-* instances for checkpointed re-entry when that STEP is the current progress bound. Keep concrete role-agent allocation separate, runtime IDs only for multi-agent runtime instances, complete contracts authored by ROOT or one explicitly justified direct lane-sub-orchestrator tier for terminal workers, no third orchestration tier, and agent sessions unbounded."
policy:
  allow_implicit_invocation: false
