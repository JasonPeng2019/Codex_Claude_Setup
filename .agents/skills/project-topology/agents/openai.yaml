interface:
  display_name: "Project Topology"
  short_description: "Plan specified behavior without process bloat."
  default_prompt: "Use $project-topology after $project-specification, or once product behavior and acceptance are already detailed, to create the stable PLAN.md plus STEP-* package. Map governing behavior to repository-grounded technical work and decisive evidence, preserve valid progress, add process only for concrete needs, and run the ROOT-adjudicated Bullshit Checker loop until no valid overcomplexity findings remain."
policy:
  allow_implicit_invocation: false
